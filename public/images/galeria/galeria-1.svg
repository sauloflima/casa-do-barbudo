<!-- SUBSTITUIR: foto do ambiente com luzes hexagonais (imagem de destaque na galeria) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <pattern id="hex1" width="56" height="48.5" patternUnits="userSpaceOnUse">
      <polygon
        points="28,2 52,15.5 52,33 28,46.5 4,33 4,15.5"
        fill="none"
        stroke="#c9a24d"
        stroke-width="1"
        opacity="0.32"
      />
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e6cb84" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e6cb84" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="#15130f" />
  <rect width="800" height="800" fill="url(#glow1)" />
  <rect width="800" height="800" fill="url(#hex1)" />
  <text x="400" y="390" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#f4ecd8">SUBSTITUIR: FOTO</text>
  <text x="400" y="422" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#c9a24d">Luzes hexagonais (destaque)</text>
</svg>
