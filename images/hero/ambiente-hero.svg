<!-- SUBSTITUIR: foto real do ambiente (destaque: luzes hexagonais) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="hex" width="64" height="55.4" patternUnits="userSpaceOnUse">
      <polygon
        points="32,2 60,17.7 60,37.7 32,53.4 4,37.7 4,17.7"
        fill="none"
        stroke="#c9a24d"
        stroke-width="1"
        opacity="0.3"
      />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e6cb84" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#e6cb84" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#15130f" />
  <rect width="1600" height="1000" fill="url(#glow)" />
  <rect width="1600" height="1000" fill="url(#hex)" />

  <!-- Rótulo discreto no canto (não fica sob o texto do hero, que é centralizado). -->
  <text
    x="40"
    y="960"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="18"
    letter-spacing="1"
    fill="#c9a24d"
    opacity="0.85"
  >SUBSTITUIR: foto do ambiente (luzes hexagonais)</text>
</svg>
